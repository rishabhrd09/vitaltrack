<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1378.76" width="1560" height="1378.76" role="img" aria-labelledby="t d">
<title id="t">Inventory answers and local order drafts</title>
<desc id="d">Voice recognizes reviewed text and prepares validated inventory answers or an unsaved local draft. Optional Groq returns specifications only. A separate touch confirmation saves an order; voice cannot change stock or orders.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2B3138"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 10 0 L 0 5 L 10 10 z" fill="#2B3138"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="40.0" y="52.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#16191D" text-anchor="start">Voice answers and unsaved drafts — touch to save</text>
<text x="40.0" y="84.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#4A5260" text-anchor="start">Local live words; offline or consented online final transcript; optional Groq interpretation. No voice mutation tool exists.</text>
<rect x="60.0" y="190.0" width="1440.0" height="100.0" rx="12" fill="#E7F0FB" stroke="#1F5FA8" stroke-width="2"/>
<text x="74.0" y="221.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1F5FA8" text-anchor="start">1. Tap → capture + local live words → tap again</text>
<text x="74.0" y="247.4" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">New APK: one Android AudioRecord, mono PCM16/16 kHz temporary WAV, provisional Moonshine English captions with the downloaded pack. Maximum 28 seconds; foreground only. Older modules:</text>
<text x="74.0" y="267.2" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Expo AAC/M4A, 44.1 kHz/128 kb/s, words after Stop.</text>
<path d="M 780.0 290.0 L 780.0 318.0" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="60.0" y="320.0" width="1440.0" height="100.0" rx="12" fill="#F1ECFA" stroke="#5E4596" stroke-width="2" stroke-dasharray="8 6"/>
<text x="74.0" y="351.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#5E4596" text-anchor="start">2. Final transcript → review/edit → Send</text>
<text x="74.0" y="377.5" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Default: Moonshine locally. Optional Groq Whisper (whisper-large-v3) through POST /ai/transcribe after Stop requires groq_audio consent, fresh audioOptIn and server capability.</text>
<text x="74.0" y="397.3" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Temporary audio deleted; no automatic interpretation or provider substitution.</text>
<path d="M 780.0 420.1 L 780.0 448.1" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="60.0" y="450.1" width="1440.0" height="119.8" rx="12" fill="#F1ECFA" stroke="#5E4596" stroke-width="2" stroke-dasharray="8 6"/>
<text x="74.0" y="481.1" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#5E4596" text-anchor="start">3. Phone grammar, or consented Groq plan (contract 3)</text>
<text x="74.0" y="507.5" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Local complete plans first; polite wording preserves groups. Unmatched reviewed text → POST /ai/interpret → openai/gpt-oss-20b with groq_text consent. Prefer v3; older contracts handle</text>
<text x="74.0" y="527.3" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">basic requests only, detected advanced conditions are blocked. Lexical checks reject lost numeric signs, filters, polarity and associations; no inventory snapshot or tools sent.</text>
<text x="74.0" y="547.1" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Meaning still needs review.</text>
<path d="M 780.0 569.9 L 780.0 597.9" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="60.0" y="599.9" width="1440.0" height="100.0" rx="12" fill="#E7F0FB" stroke="#1F5FA8" stroke-width="2"/>
<text x="74.0" y="630.9" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1F5FA8" text-anchor="start">4. Owned snapshot → deterministic executor</text>
<text x="74.0" y="657.4" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Same-session owned complete inventory, no pending writes. Union of AND-groups, minus exclusions, unique by item ID, then sorted; each row gets a reason. Ambiguous names,</text>
<text x="74.0" y="677.2" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">critical-versus-category, missing quantities or unit mismatches ask first. Offline = last-known.</text>
<path d="M 780.0 700.0 L 780.0 728.0" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="60.0" y="730.0" width="1440.0" height="119.8" rx="12" fill="#E6F4EA" stroke="#1E6B34" stroke-width="2"/>
<text x="74.0" y="761.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1E6B34" text-anchor="start">5. In-app table or UNSAVED session draft</text>
<text x="74.0" y="787.4" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Native virtualized rows: filters, wrapping units, status icon + text, Why and Explicit/Suggested labels. Device TTS or consented Sarvam: explicit billing, short answer → POST /ai/speak</text>
<text x="74.0" y="807.2" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">→ Bulbul → validated WAV → fresh player. Preview verifies live speech; configuration alone does not. Opt-in offline fallback runs only before playback starts. Alba stays paused.</text>
<text x="74.0" y="827.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Explicit/exclusion conflicts clarify the whole draft; existing work needs merge/replace/cancel review.</text>
<path d="M 780.0 849.8 L 780.0 877.8" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="60.0" y="879.8" width="1440.0" height="80.2" rx="12" fill="#FCEBEA" stroke="#A8261D" stroke-width="2"/>
<text x="74.0" y="910.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#A8261D" text-anchor="start">VOICE BOUNDARY — no order or stock save</text>
<text x="74.0" y="937.2" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Voice can prepare/edit a draft; saying confirm cannot commit. Inventory-report PDF requires reviewed touch export. Consent/usage writes may occur in cloud mode.</text>
<rect x="60.0" y="1018.0" width="1440.0" height="80.2" rx="12" fill="#E7F0FB" stroke="#1F5FA8" stroke-width="2"/>
<text x="74.0" y="1049.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1F5FA8" text-anchor="start">6. Separate TOUCH: Confirm order &amp; export PDF</text>
<text x="74.0" y="1075.5" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Create Order checks matching backend capability, refreshes inventory, retains reviewed quantities, and asks for another review if stock changed. Saving requires internet.</text>
<path d="M 780.0 1098.3 L 780.0 1126.3" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="60.0" y="1128.3" width="1440.0" height="80.2" rx="12" fill="#E7F0FB" stroke="#1F5FA8" stroke-width="2"/>
<text x="74.0" y="1159.3" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1F5FA8" text-anchor="start">7. Authenticated POST /orders</text>
<text x="74.0" y="1185.7" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Stable localId, ownership check, expectedVersion under item locks. Changed/inactive items return 409. A successful create writes order/lines/activity; inventory does not increase.</text>
<path d="M 780.0 1208.5 L 780.0 1236.5" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="60.0" y="1238.5" width="1440.0" height="80.2" rx="12" fill="#E6F4EA" stroke="#1E6B34" stroke-width="2"/>
<text x="74.0" y="1269.5" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1E6B34" text-anchor="start">8. PDF from saved response</text>
<text x="74.0" y="1296.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Shared order template. Unknown save outcome: same-request retry. Saved order + failed PDF: re-export same order. Stock updates remain a separate /orders/{id}/apply workflow.</text>
</svg>
