<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1319.36" width="1560" height="1319.36" role="img" aria-labelledby="t d">
<title id="t">Inventory answers and local order drafts</title>
<desc id="d">Voice recognizes reviewed text and prepares validated inventory answers or an unsaved local draft. Optional Groq returns specifications only. A separate touch confirmation saves an order; voice cannot change stock or orders.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2B3138"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 10 0 L 0 5 L 10 10 z" fill="#2B3138"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="40.0" y="52.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#16191D" text-anchor="start">Voice answers and unsaved drafts — touch to save</text>
<text x="40.0" y="84.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#4A5260" text-anchor="start">Local live words; offline or consented online final transcript; optional Groq interpretation. No voice mutation tool exists.</text>
<rect x="60.0" y="190.0" width="1440.0" height="100.0" rx="12" fill="#E7F0FB" stroke="#1F5FA8" stroke-width="2"/>
<text x="74.0" y="221.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1F5FA8" text-anchor="start">1. Tap → capture + local live words → tap again</text>
<text x="74.0" y="247.4" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">New APK: one Android AudioRecord, mono PCM16/16 kHz temporary WAV, provisional Moonshine English captions with the downloaded pack. Maximum 28 seconds; foreground only. Older modules:</text>
<text x="74.0" y="267.2" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Expo AAC/M4A, 44.1 kHz/128 kb/s, words after Stop.</text>
<path d="M 780.0 290.0 L 780.0 318.0" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="60.0" y="320.0" width="1440.0" height="100.0" rx="12" fill="#F1ECFA" stroke="#5E4596" stroke-width="2" stroke-dasharray="8 6"/>
<text x="74.0" y="351.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#5E4596" text-anchor="start">2. Final transcript → review/edit → Send</text>
<text x="74.0" y="377.5" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Default: Moonshine locally. Optional Groq Whisper (whisper-large-v3) through POST /ai/transcribe after Stop requires groq_audio consent, fresh audioOptIn and server capability.</text>
<text x="74.0" y="397.3" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Temporary audio deleted; no automatic interpretation or provider substitution.</text>
<path d="M 780.0 420.1 L 780.0 448.1" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="60.0" y="450.1" width="1440.0" height="100.0" rx="12" fill="#F1ECFA" stroke="#5E4596" stroke-width="2" stroke-dasharray="8 6"/>
<text x="74.0" y="481.1" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#5E4596" text-anchor="start">3. Local parsing or consented Groq specification</text>
<text x="74.0" y="507.5" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Familiar wording stays local. Otherwise reviewed text → POST /ai/interpret → openai/gpt-oss-20b, groq_text consent, strict v2 schema. Names, quantities and units validated; no</text>
<text x="74.0" y="527.3" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">inventory list or executable tools sent. Correct schema does not prove correct meaning.</text>
<path d="M 780.0 550.1 L 780.0 578.1" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="60.0" y="580.1" width="1440.0" height="80.2" rx="12" fill="#E7F0FB" stroke="#1F5FA8" stroke-width="2"/>
<text x="74.0" y="611.1" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1F5FA8" text-anchor="start">4. Verified inventory snapshot and resolution</text>
<text x="74.0" y="637.6" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Same-session owned complete inventory, no pending writes. Refresh as needed. Ambiguity, missing quantities or unit mismatches require clarification. Offline = last-known.</text>
<path d="M 780.0 660.4 L 780.0 688.4" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="60.0" y="690.4" width="1440.0" height="100.0" rx="12" fill="#E6F4EA" stroke="#1E6B34" stroke-width="2"/>
<text x="74.0" y="721.4" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1E6B34" text-anchor="start">5. In-app table or UNSAVED session draft</text>
<text x="74.0" y="747.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Native virtualized rows, freshness/filters, concise Android offline TTS. Hosted speech is disabled. Explicit amounts win over deterministic minimum-stock suggestions. Manual draft:</text>
<text x="74.0" y="767.6" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">review merge/replace/cancel.</text>
<path d="M 780.0 790.4 L 780.0 818.4" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="60.0" y="820.4" width="1440.0" height="80.2" rx="12" fill="#FCEBEA" stroke="#A8261D" stroke-width="2"/>
<text x="74.0" y="851.4" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#A8261D" text-anchor="start">VOICE BOUNDARY — no order or stock save</text>
<text x="74.0" y="877.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Voice can prepare/edit a draft; saying confirm cannot commit. Inventory-report PDF requires reviewed touch export. Consent/usage writes may occur in cloud mode.</text>
<rect x="60.0" y="958.6" width="1440.0" height="80.2" rx="12" fill="#E7F0FB" stroke="#1F5FA8" stroke-width="2"/>
<text x="74.0" y="989.6" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1F5FA8" text-anchor="start">6. Separate TOUCH: Confirm order &amp; export PDF</text>
<text x="74.0" y="1016.1" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Create Order checks matching backend capability, refreshes inventory, retains reviewed quantities, and asks for another review if stock changed. Saving requires internet.</text>
<path d="M 780.0 1038.9 L 780.0 1066.9" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="60.0" y="1068.9" width="1440.0" height="80.2" rx="12" fill="#E7F0FB" stroke="#1F5FA8" stroke-width="2"/>
<text x="74.0" y="1099.9" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1F5FA8" text-anchor="start">7. Authenticated POST /orders</text>
<text x="74.0" y="1126.3" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Stable localId, ownership check, expectedVersion under item locks. Changed/inactive items return 409. A successful create writes order/lines/activity; inventory does not increase.</text>
<path d="M 780.0 1149.1 L 780.0 1177.1" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="60.0" y="1179.1" width="1440.0" height="80.2" rx="12" fill="#E6F4EA" stroke="#1E6B34" stroke-width="2"/>
<text x="74.0" y="1210.1" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1E6B34" text-anchor="start">8. PDF from saved response</text>
<text x="74.0" y="1236.6" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Shared order template. Unknown save outcome: same-request retry. Saved order + failed PDF: re-export same order. Stock updates remain a separate /orders/{id}/apply workflow.</text>
</svg>
