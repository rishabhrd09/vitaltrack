<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1080" width="1560" height="1080" role="img" aria-labelledby="t d">
<title id="t">Mobile cache versus the server</title>
<desc id="d">PostgreSQL behind the API is the only source of truth. The app keeps a TanStack Query cache in memory and persists a copy to AsyncStorage for display after a restart. Screens read through query hooks; stale data is refetched on mount, return to the foreground, reconnect, pull-to-refresh or invalidation. Writes go straight to the API. Hook-based mutations invalidate affected queries after success, an uncertain network/gateway failure or a 409. There are no optimistic updates and no offline write queue.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2B3138"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 10 0 L 0 5 L 10 10 z" fill="#2B3138"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="40.0" y="52.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#16191D" text-anchor="start">Server is the source of truth; the phone keeps a display cache</text>
<text x="40.0" y="84.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#4A5260" text-anchor="start">Read path (blue), write path (amber). No optimistic writes; a failed response may follow commit. Refetch before retrying.</text>
<rect x="1040.0" y="150.0" width="480.0" height="300.0" rx="12" fill="#FFF3DB" stroke="#8F5B00" stroke-width="2"/>
<text x="1054.0" y="181.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#8F5B00" text-anchor="start">CareKosh API + PostgreSQL</text>
<text x="1054.0" y="207.4" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">The only source of truth for categories, items, orders and</text>
<text x="1054.0" y="227.2" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">activity.</text>
<text x="1054.0" y="247.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Owner-scoped business reads; separate global counters and</text>
<text x="1054.0" y="266.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">AI quotas.</text>
<rect x="40.0" y="150.0" width="440.0" height="300.0" rx="12" fill="#E7F0FB" stroke="#1F5FA8" stroke-width="2"/>
<text x="54.0" y="181.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1F5FA8" text-anchor="start">Screens (React Native)</text>
<text x="54.0" y="207.4" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">useItems → [&#x27;items&#x27;] (all pages)</text>
<text x="54.0" y="227.2" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">useCategories → [&#x27;categories&#x27;]</text>
<text x="54.0" y="247.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">useOrders → [&#x27;orders&#x27;] (staleTime 0)</text>
<text x="54.0" y="266.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">useActivities(20) → [&#x27;activities&#x27;]</text>
<text x="54.0" y="286.6" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Profile: zustand store, not TanStack</text>
<text x="54.0" y="306.4" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Dashboard counts computed on the phone</text>
<rect x="540.0" y="150.0" width="440.0" height="300.0" rx="12" fill="#E7F0FB" stroke="#1F5FA8" stroke-width="2"/>
<text x="554.0" y="181.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1F5FA8" text-anchor="start">TanStack Query cache (memory)</text>
<text x="554.0" y="207.4" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">staleTime 30 s, gcTime 24 h, retry 3 (queries)</text>
<text x="554.0" y="227.2" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">refetch on mount, focus (AppState), reconnect</text>
<text x="554.0" y="247.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">(NetInfo), pull-to-refresh, invalidation</text>
<text x="554.0" y="266.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">networkMode offlineFirst: show cache, pause retries</text>
<text x="554.0" y="286.6" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">offline</text>
<text x="554.0" y="306.4" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Invalidated after this app&#x27;s saves, uncertain</text>
<text x="554.0" y="326.2" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">failures and 409s; no server push, so other phones&#x27;</text>
<text x="554.0" y="346.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">edits appear after a refetch.</text>
<rect x="540.0" y="540.0" width="440.0" height="210.0" rx="12" fill="#E3F3EF" stroke="#1B7563" stroke-width="2"/>
<text x="554.0" y="571.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1B7563" text-anchor="start">AsyncStorage copy &#x27;carekosh-query-cache&#x27;</text>
<text x="554.0" y="597.4" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Restored at start if &lt; 24 h old and the app version</text>
<text x="554.0" y="617.2" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">(buster) matches.</text>
<text x="554.0" y="637.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Display cache only; mutations are never persisted.</text>
<text x="554.0" y="656.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Cleared at login and logout (shared-device safety).</text>
<rect x="40.0" y="540.0" width="440.0" height="300.0" rx="12" fill="#FFF3DB" stroke="#8F5B00" stroke-width="2"/>
<text x="54.0" y="571.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#8F5B00" text-anchor="start">Write path (mutations)</text>
<text x="54.0" y="597.4" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Button → offline check (NetInfo) → useMutation →</text>
<text x="54.0" y="617.2" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">service → API</text>
<text x="54.0" y="637.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">retry 0, networkMode always: no delayed offline</text>
<text x="54.0" y="656.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">replay</text>
<text x="54.0" y="676.6" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">on success, network/gateway failure or 409:</text>
<text x="54.0" y="696.4" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">invalidate affected keys → active views refetch</text>
<text x="54.0" y="716.2" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">ordinary request deadline: 90 s overall; no</text>
<text x="54.0" y="736.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">optimistic updates</text>
<text x="54.0" y="755.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">on error: toast or dialog; Retry keeps the same</text>
<text x="54.0" y="775.6" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">variables</text>
<rect x="1040.0" y="540.0" width="480.0" height="300.0" rx="12" fill="#F1F2F4" stroke="#4A5260" stroke-width="2"/>
<text x="1054.0" y="571.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#4A5260" text-anchor="start">What the person sees</text>
<text x="1054.0" y="597.4" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Toast or &#x27;Saved&#x27; dialog after a write; &#x27;Updating…&#x27; on rows</text>
<text x="1054.0" y="617.2" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">while saving.</text>
<text x="1054.0" y="637.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Offline: &#x27;showing last synced data&#x27; (Dashboard, Orders); no</text>
<text x="1054.0" y="656.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">last-sync time on lists.</text>
<text x="1054.0" y="676.6" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Assistant answers say &#x27;Last synced · time&#x27; or &#x27;Last known</text>
<text x="1054.0" y="696.4" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">stock&#x27;.</text>
<text x="1054.0" y="716.2" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Item 409: server message and active-query refetch; reopen</text>
<text x="1054.0" y="736.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">the form.</text>
<path d="M 480.0 300.0 L 540.0 300.0" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="510.0" y="290.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">read</text>
<path d="M 980.0 230.0 L 1040.0 230.0" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
<text x="1010.0" y="218.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">GET</text>
<path d="M 760.0 450.0 L 760.0 540.0" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
<text x="772.0" y="520.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#16191D" text-anchor="start" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">persist / restore</text>
<path d="M 480.0 580.0 L 505.0 580.0 L 505.0 495.0 L 1280.0 495.0 L 1280.0 450.0" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="1000.0" y="487.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">POST / PUT / PATCH / DELETE</text>
<rect x="40.0" y="880.0" width="1480.0" height="160.0" rx="12" fill="#E7F0FB" stroke="#1F5FA8" stroke-width="2"/>
<text x="54.0" y="911.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1F5FA8" text-anchor="start">Voice assistant reads (read-only)</text>
<text x="54.0" y="937.4" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Reuses [&#x27;items&#x27;] only if it was fetched in this login (in-memory ownership stamp), is not invalidated and is under 30 s old; otherwise fetchQuery([&#x27;items&#x27;]) → GET /api/v1/items (all pages,</text>
<text x="54.0" y="957.2" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">20 s abort). Offline: last-known owned data labelled &#x27;Last known&#x27;. Restored disk data alone is never trusted, and no answer is given while a save is pending.</text>
</svg>
