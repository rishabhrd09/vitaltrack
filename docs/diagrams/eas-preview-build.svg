<svg width="1000" height="666" viewBox="0 0 1000 666" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="eas-preview-t eas-preview-d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title id="eas-preview-t">How a preview APK is built</title><desc id="eas-preview-d">The GitHub Actions job runs eas build for the preview profile without waiting; the EAS CLI uploads the project, prints the build URL in the job log and the job ends; EAS then installs dependencies, runs Gradle, signs the APK and stores it on expo.dev.</desc><defs><marker id="eas-preview-ah-3d5a99" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 Z" fill="#3D5A99"/></marker><marker id="eas-preview-ah-1f6f66" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 Z" fill="#1F6F66"/></marker></defs>
<rect x="0" y="0" width="1000" height="666" rx="18" fill="#FFFFFF"/>
<rect x="60" y="24" width="380" height="56" rx="14" fill="#F1F4F5" stroke="#687A83" stroke-width="2.2"/>
<text x="250.0" y="60.5" font-size="18.5" font-weight="700" fill="#35474F" text-anchor="middle">GitHub Actions job</text>
<path d="M250,82 L250,352" fill="none" stroke="#8FA39D" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 7"/>
<rect x="560" y="24" width="380" height="56" rx="14" fill="#EAF0FA" stroke="#3D5A99" stroke-width="2.2"/>
<text x="750.0" y="60.5" font-size="18.5" font-weight="700" fill="#243E76" text-anchor="middle">Expo EAS servers</text>
<path d="M750,82 L750,580" fill="none" stroke="#8FA39D" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 7"/>
<rect x="70" y="110" width="360" height="99" rx="14" fill="#FFFFFF" stroke="#9AAAA6" stroke-width="2.2"/>
<text x="90" y="146.5" font-size="14.5" font-weight="400" fill="#34504A" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">eas build --profile preview</text>
<text x="90" y="167.5" font-size="14.5" font-weight="400" fill="#34504A" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">  --platform android</text>
<text x="90" y="188.5" font-size="14.5" font-weight="400" fill="#34504A" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">  --non-interactive --no-wait</text>
<circle cx="70" cy="112" r="16" fill="#1F6F66"/>
<text x="70" y="117.76" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<path d="M250,262 L744,262" fill="none" stroke="#3D5A99" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#eas-preview-ah-3d5a99)"/>
<circle cx="290" cy="262" r="16" fill="#3D5A99"/>
<text x="290" y="267.76" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="385.634875" y="225.25" width="228.73024999999996" height="25.5" rx="12.75" fill="#FFFFFF" stroke="#3D5A99" stroke-width="1.5"/>
<text x="500" y="242.725" font-size="13.5" font-weight="650" fill="#3D5A99" text-anchor="middle">uploads a tarball of the project</text>
<rect x="570" y="380" width="360" height="80" rx="14" fill="#EAF0FA" stroke="#3D5A99" stroke-width="2.2"/>
<text x="590" y="417.5" font-size="15.5" font-weight="400" fill="#2A3A57" text-anchor="start">Installs dependencies,</text>
<text x="590" y="439.5" font-size="15.5" font-weight="400" fill="#2A3A57" text-anchor="start">runs Gradle, signs the APK</text>
<circle cx="570" cy="382" r="16" fill="#3D5A99"/>
<text x="570" y="387.76" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="570" y="480" width="360" height="58" rx="14" fill="#EAF0FA" stroke="#3D5A99" stroke-width="2.2"/>
<text x="590" y="517.5" font-size="15.5" font-weight="400" fill="#2A3A57" text-anchor="start">Stores the APK on expo.dev</text>
<circle cx="570" cy="482" r="16" fill="#3D5A99"/>
<text x="570" y="487.76" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<path d="M750,330 L256,330" fill="none" stroke="#1F6F66" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#eas-preview-ah-1f6f66)"/>
<circle cx="710" cy="330" r="16" fill="#1F6F66"/>
<text x="710" y="335.76" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="383.612575" y="293.25" width="232.77484999999996" height="25.5" rx="12.75" fill="#FFFFFF" stroke="#1F6F66" stroke-width="1.5"/>
<text x="500" y="310.725" font-size="13.5" font-weight="650" fill="#1F6F66" text-anchor="middle">build URL printed in the job log</text>
<rect x="70" y="352" width="360" height="80" rx="14" fill="#FFFFFF" stroke="#9AAAA6" stroke-width="2.2"/>
<text x="90" y="389" font-size="15" font-weight="400" fill="#34504A" text-anchor="start">The job ends after queuing;</text>
<text x="90" y="411" font-size="15" font-weight="400" fill="#34504A" text-anchor="start">it does not wait for the APK.</text>
<rect x="30" y="600" width="940" height="58" rx="14" fill="#FFF6DE" stroke="#B07A1A" stroke-width="2.2"/>
<text x="50" y="637.5" font-size="15.5" text-anchor="start"><tspan font-weight="700" fill="#77500F">From your laptop, </tspan><tspan font-weight="400" fill="#5A4012">eas build uploads your local files too, including uncommitted changes.</tspan></text>
</svg>
