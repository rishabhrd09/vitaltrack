<svg width="1000" height="792" viewBox="0 0 1000 792" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="code-to-phone-t code-to-phone-d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title id="code-to-phone-t">From code to phone</title><desc id="code-to-phone-d">Pull requests to main, pushes to main and manual runs trigger GitHub Actions; a feature-branch push alone does not. On a push to main, CI requests the Render deploy hook only if that secret is set, and Render may also auto-deploy (dashboard setting, not verified); Render runs the FastAPI backend with PostgreSQL, documented as hosted on Neon. Expo EAS builds the APK and AAB; the AAB reaches phones through Google Play. The installed app calls the API over HTTPS.</desc><defs><marker id="code-to-phone-ah-1f6f66" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 Z" fill="#1F6F66"/></marker><marker id="code-to-phone-ah-3d5a99" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 Z" fill="#3D5A99"/></marker></defs>
