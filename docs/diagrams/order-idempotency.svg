<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1238" width="1500" height="1238" role="img" aria-labelledby="t d">
<title id="t">Order creation and retries</title>
<desc id="d">The current app generates one localId per Save. A retry with the same localId returns the order already created with status 200. Two simultaneous requests with the same localId collide on a partial unique index; the loser rolls back, which also releases its order number, and returns the winner&#x27;s order. Requests without a localId, such as those from older app builds, always create a new order.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2B3138"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 10 0 L 0 5 L 10 10 z" fill="#2B3138"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="40.0" y="52.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#16191D" text-anchor="start">Order creation: submission keys (localId) and order numbers</text>
<text x="40.0" y="84.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#4A5260" text-anchor="start">0010 protects indexed non-null keys; later legacy duplicates are exempt by id. A changed-payload replay returns the original order.</text>
<rect x="52.0" y="120.0" width="449.3" height="64.0" rx="12" fill="#E7F0FB" stroke="#1F5FA8" stroke-width="2"/>
<text x="276.7" y="150.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#1F5FA8" text-anchor="middle">Phone: Create Order screen</text>
<rect x="525.3" y="120.0" width="449.3" height="64.0" rx="12" fill="#E7F0FB" stroke="#1F5FA8" stroke-width="2"/>
<text x="750.0" y="150.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#1F5FA8" text-anchor="middle">POST /api/v1/orders</text>
<rect x="998.7" y="120.0" width="449.3" height="64.0" rx="12" fill="#FFF3DB" stroke="#8F5B00" stroke-width="2"/>
<text x="1223.3" y="150.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#8F5B00" text-anchor="middle">PostgreSQL</text>
<line x1="276.7" y1="184.0" x2="276.7" y2="1198.3" stroke="#9AA2AE" stroke-width="1.6" stroke-dasharray="6 6"/>
<line x1="750.0" y1="184.0" x2="750.0" y2="1198.3" stroke="#9AA2AE" stroke-width="1.6" stroke-dasharray="6 6"/>
<line x1="1223.3" y1="184.0" x2="1223.3" y2="1198.3" stroke="#9AA2AE" stroke-width="1.6" stroke-dasharray="6 6"/>
<line x1="30.0" y1="208.0" x2="1470.0" y2="208.0" stroke="#C9CED6" stroke-width="1.2"/>
<text x="44.0" y="230.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#4A5260" text-anchor="start" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">1 · first attempt</text>
<path d="M 276.7 262.0 L 742.0 262.0" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="513.3" y="252.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">1. Save → localId L (generated once for this press) + lines</text>
<path d="M 750.0 320.0 L 1215.3 320.0" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="986.7" y="310.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">2. SELECT order WHERE user_id AND local_id = L → none</text>
<path d="M 750.0 378.0 L 1215.3 378.0" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="986.7" y="368.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">3. validate every itemId belongs to this user (else 400)</text>
<path d="M 750.0 454.8 L 1215.3 454.8" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="986.7" y="426.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">4. INSERT INTO order_number_counters … ON CONFLICT (day) DO UPDATE</text>
<text x="986.7" y="444.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">SET last_value = last_value + 1 RETURNING → 7</text>
<path d="M 750.0 512.8 L 1215.3 512.8" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="986.7" y="502.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">5. INSERT orders (ORD-20261007-0007) + order_items + activity · COMMIT</text>
<path d="M 750.0 570.8 L 284.7 570.8" fill="none" stroke="#2B3138" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="513.3" y="560.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">6. 201 Created</text>
<line x1="30.0" y1="618.8" x2="1470.0" y2="618.8" stroke="#C9CED6" stroke-width="1.2"/>
<text x="44.0" y="640.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#4A5260" text-anchor="start" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">2 · the response was lost; the person taps Retry, which resends the same L</text>
<path d="M 276.7 672.8 L 742.0 672.8" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="513.3" y="662.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">7. POST again with localId L</text>
<path d="M 750.0 730.8 L 1215.3 730.8" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="986.7" y="720.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">8. SELECT … local_id = L → found</text>
<path d="M 750.0 788.8 L 284.7 788.8" fill="none" stroke="#2B3138" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="513.3" y="778.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">9. 200 OK — the same order, nothing new written</text>
<line x1="30.0" y1="836.8" x2="1470.0" y2="836.8" stroke="#C9CED6" stroke-width="1.2"/>
<text x="44.0" y="858.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#4A5260" text-anchor="start" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">3 · two identical requests arrive at the same moment</text>
<path d="M 750.0 890.8 L 1215.3 890.8" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="986.7" y="880.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">10. both: lookup → none; both: counter upsert (second waits for the row lock)</text>
<path d="M 750.0 948.8 L 1215.3 948.8" fill="none" stroke="#A8261D" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="986.7" y="938.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">11. second INSERT hits uq_orders_user_id_local_id → IntegrityError</text>
<path d="M 750.0 1006.8 L 1215.3 1006.8" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="986.7" y="996.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">12. ROLLBACK (its counter increment is undone too) → SELECT the winner</text>
<path d="M 750.0 1064.8 L 284.7 1064.8" fill="none" stroke="#2B3138" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="513.3" y="1054.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">13. 201 for one request, 200 with the same order for the other</text>
<rect x="77.9" y="1104.8" width="1344.3" height="59.6" rx="8" fill="#FFF8D6" stroke="#7A6A00" stroke-width="1.6"/>
<text x="87.9" y="1129.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">No localId (older installed builds): each POST creates a new order. A new localId per press means two deliberate presses are two orders. Order numbers are per UTC day, never</text>
<text x="87.9" y="1149.5" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">reused after deletion, and the counter row briefly serializes concurrent order creation across all users.</text>
</svg>
