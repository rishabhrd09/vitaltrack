<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" width="1500" height="900" role="img" aria-labelledby="t d">
<title id="t">Order status flow</title>
<desc id="d">Orders start pending. Pending can become ordered, received or declined. Ordered can become partially received or received. Partially received can become received. Received becomes stock updated only through POST apply, which adds every line&#x27;s full quantity to stock in one transaction. Declined and stock updated are final. Only pending and declined orders can be deleted.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2B3138"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 10 0 L 0 5 L 10 10 z" fill="#2B3138"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="40.0" y="52.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#16191D" text-anchor="start">Order status machine and applying stock</text>
<text x="40.0" y="84.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#4A5260" text-anchor="start">PATCH /orders/{id}/status enforces these arrows (400 otherwise; same status = no-op). Only POST /orders/{id}/apply reaches stock_updated.</text>
<rect x="60.0" y="230.0" width="280.0" height="92.0" rx="12" fill="#E6F4EA" stroke="#1E6B34" stroke-width="2"/>
<text x="200.0" y="261.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1E6B34" text-anchor="middle">pending</text>
<text x="200.0" y="287.4" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="middle">created by POST /orders ·</text>
<text x="200.0" y="307.2" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="middle">deletable</text>
<rect x="420.0" y="150.0" width="280.0" height="92.0" rx="12" fill="#E7F0FB" stroke="#1F5FA8" stroke-width="2"/>
<text x="560.0" y="181.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1F5FA8" text-anchor="middle">ordered</text>
<text x="560.0" y="207.4" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="middle">sets ordered_at</text>
<rect x="780.0" y="150.0" width="280.0" height="92.0" rx="12" fill="#E7F0FB" stroke="#1F5FA8" stroke-width="2"/>
<text x="920.0" y="181.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1F5FA8" text-anchor="middle">partially_received</text>
<text x="920.0" y="207.4" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="middle">label only — no quantities</text>
<rect x="780.0" y="400.0" width="280.0" height="92.0" rx="12" fill="#E7F0FB" stroke="#1F5FA8" stroke-width="2"/>
<text x="920.0" y="431.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1F5FA8" text-anchor="middle">received</text>
<text x="920.0" y="457.4" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="middle">sets received_at · not deletable</text>
<rect x="60.0" y="520.0" width="280.0" height="92.0" rx="12" fill="#FCEBEA" stroke="#A8261D" stroke-width="2"/>
<text x="200.0" y="551.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#A8261D" text-anchor="middle">declined</text>
<text x="200.0" y="577.4" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="middle">final · sets declined_at ·</text>
<text x="200.0" y="597.2" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="middle">deletable</text>
<rect x="1150.0" y="400.0" width="280.0" height="92.0" rx="12" fill="#E3F3EF" stroke="#1B7563" stroke-width="2"/>
<text x="1290.0" y="431.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1B7563" text-anchor="middle">stock_updated</text>
<text x="1290.0" y="457.4" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="middle">final · sets applied_at</text>
<path d="M 340.0 255.0 L 420.0 205.0" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M 340.0 290.0 L 560.0 290.0 L 560.0 420.0 L 780.0 420.0" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="450.0" y="282.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">pending → received</text>
<path d="M 200.0 322.0 L 200.0 520.0" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M 700.0 196.0 L 780.0 196.0" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M 640.0 242.0 L 640.0 380.0 L 780.0 380.0 L 780.0 400.0" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M 920.0 242.0 L 920.0 400.0" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M 1060.0 446.0 L 1150.0 446.0" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="1105.0" y="432.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">POST /apply</text>
<text x="205.0" y="470.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#16191D" text-anchor="start" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">declined</text>
<text x="648.0" y="330.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#16191D" text-anchor="start" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">ordered → received</text>
<rect x="60.0" y="660.0" width="1380.0" height="200.0" rx="12" fill="#E7F0FB" stroke="#1F5FA8" stroke-width="2"/>
<text x="74.0" y="691.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1F5FA8" text-anchor="start">What POST /orders/{id}/apply does — one transaction</text>
<text x="74.0" y="717.4" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">1. Load the order (yours, status received, at least one line) → else 404 / 400.</text>
<text x="74.0" y="737.2" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">2. Check every line&#x27;s item still exists → else 409 and nothing changes.</text>
<text x="74.0" y="757.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">3. Claim: UPDATE orders SET status=&#x27;STOCK_UPDATED&#x27;, applied_at=now WHERE status=&#x27;RECEIVED&#x27; (the column stores enum names) → a second apply gets 400.</text>
<text x="74.0" y="776.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">4. For each line, in item-id order: UPDATE items SET quantity = quantity + line.quantity, version = version + 1; write an audit row.</text>
<text x="74.0" y="796.6" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">5. Write ORDER_APPLIED activity, COMMIT. Any failure before COMMIT rolls back steps 3–5.</text>
</svg>
