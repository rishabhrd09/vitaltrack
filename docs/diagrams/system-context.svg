<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1010" width="1400" height="1010" role="img" aria-labelledby="t d">
<title id="t">CareKosh system context</title>
<desc id="d">The Android app talks to one FastAPI service over HTTPS; the service owns the PostgreSQL database. Live captions, default recognition and spoken replies run on the phone. Groq text interpretation and optional Whisper recognition need separate consent; Brevo and Sentry are optional and only used when configured. The core API has no queue, Redis cache or offline write queue. Optional speech-worker code exists; deployment is unverified and the mobile build disables hosted speech output.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2B3138"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 10 0 L 0 5 L 10 10 z" fill="#2B3138"/></marker></defs>
