<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 815" width="1560" height="815" role="img" aria-labelledby="t d">
<title id="t">From a code change to users</title>
<desc id="d">A feature branch becomes a pull request; CI runs blocking and advisory jobs; a staging candidate is deployed separately and tested with a preview APK; merging to main can trigger enabled Render auto-deploy or a configured CI hook. The container migrates before starting. The Android app is released separately: an EAS production build is uploaded to Play internal testing and then promoted. Installed apps only change when users install the new build.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2B3138"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 10 0 L 0 5 L 10 10 z" fill="#2B3138"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="40.0" y="52.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#16191D" text-anchor="start">Delivery: CI → staging → production backend → Play Store</text>
<text x="40.0" y="84.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#4A5260" text-anchor="start">Backend and mobile releases are separate pipelines. Green CI ≠ deployed; deployed ≠ healthy; healthy ≠ the commit you expect.</text>
<rect x="40.0" y="140.0" width="330.0" height="175.2" rx="12" fill="#F1F2F4" stroke="#4A5260" stroke-width="2"/>
<text x="54.0" y="171.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#4A5260" text-anchor="start">1. Feature branch + PR to main</text>
<text x="54.0" y="197.4" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Feature pushes do not trigger this CI;</text>
<text x="54.0" y="217.2" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">a linked Render service may still</text>
<text x="54.0" y="237.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">auto-deploy.</text>
<text x="54.0" y="256.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">7 Oct ruleset evidence: PR required, 0</text>
<text x="54.0" y="276.6" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">approvals, no required status checks.</text>
<rect x="410.0" y="140.0" width="520.0" height="175.2" rx="12" fill="#E3F3EF" stroke="#1B7563" stroke-width="2"/>
<text x="424.0" y="171.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1B7563" text-anchor="start">2. GitHub Actions CI</text>
<text x="424.0" y="197.4" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Blocking in the run: Ruff, pytest (242, migrated schema), route</text>
<text x="424.0" y="217.2" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">gate 44, coverage floors, tsc, npm test (121), ESLint,</text>
<text x="424.0" y="237.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">autolinking check.</text>
<text x="424.0" y="256.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Advisory (cannot fail the run): mypy (23 errors on 7 Oct), Trivy</text>
<text x="424.0" y="276.6" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">(PRs only), expo-doctor (|| echo).</text>
<text x="424.0" y="296.4" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Optional: build-apk label → EAS preview build (APK).</text>
<rect x="970.0" y="140.0" width="550.0" height="175.2" rx="12" fill="#FFF3DB" stroke="#8F5B00" stroke-width="2"/>
<text x="984.0" y="171.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#8F5B00" text-anchor="start">3. Staging candidate (manual)</text>
<text x="984.0" y="197.4" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Render staging service is set up in the dashboard (not in</text>
<text x="984.0" y="217.2" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">render.yaml; not verified).</text>
<text x="984.0" y="237.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Deploy the candidate commit deliberately, against its own database</text>
<text x="984.0" y="256.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">(never production data).</text>
<text x="984.0" y="276.6" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Preview APK (eas.json preview) calls</text>
<text x="984.0" y="296.4" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">https://staging-api.carekosh.com.</text>
<path d="M 370.0 227.6 L 410.0 227.6" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M 930.0 227.6 L 970.0 227.6" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="40.0" y="385.2" width="600.0" height="175.2" rx="12" fill="#FFF3DB" stroke="#8F5B00" stroke-width="2"/>
<text x="54.0" y="416.2" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#8F5B00" text-anchor="start">4. Main may trigger a backend deployment</text>
<text x="54.0" y="442.7" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">render.yaml: branch main, plan starter, health check /live.</text>
<text x="54.0" y="462.5" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Render auto-deploy (dashboard setting, NOT VERIFIED) and/or CI</text>
<text x="54.0" y="482.3" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">deploy-backend calling RENDER_DEPLOY_HOOK after the test jobs, only if</text>
<text x="54.0" y="502.1" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">that secret is set.</text>
<text x="54.0" y="521.9" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">A 2xx from the hook means &#x27;request accepted&#x27;, not &#x27;deployed&#x27;.</text>
<text x="54.0" y="541.7" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Migrations 0007–0010: follow the release gate, not a plain merge.</text>
<rect x="680.0" y="385.2" width="840.0" height="175.2" rx="12" fill="#E7F0FB" stroke="#1F5FA8" stroke-width="2"/>
<text x="694.0" y="416.2" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1F5FA8" text-anchor="start">5. Every container start</text>
<text x="694.0" y="442.7" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Entrypoint: wait for PostgreSQL (≤30 × 2 s) → alembic upgrade head (exit on failure) → Gunicorn with 2</text>
<text x="694.0" y="462.5" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Uvicorn workers → Render polls /live.</text>
<text x="694.0" y="482.3" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Migrations run on every start, serialized by an advisory lock; rolling back code does NOT undo them (0007</text>
<text x="694.0" y="502.1" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">refuses downgrade).</text>
<text x="694.0" y="521.9" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">/health = database reachable. Neither probe names the running commit: check Render&#x27;s deploy record and</text>
<text x="694.0" y="541.7" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">alembic current.</text>
<path d="M 1245.0 315.2 L 1245.0 355.2 L 340.0 355.2 L 340.0 385.2" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="800.0" y="347.2" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">after staging sign-off and the release gate</text>
<path d="M 640.0 472.9 L 680.0 472.9" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="40.0" y="620.5" width="700.0" height="155.4" rx="12" fill="#FFF3DB" stroke="#8F5B00" stroke-width="2"/>
<text x="54.0" y="651.5" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#8F5B00" text-anchor="start">6. Mobile release (separate pipeline)</text>
<text x="54.0" y="677.9" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">eas build --profile production → AAB that calls https://api.carekosh.com; versionCode</text>
<text x="54.0" y="697.7" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">auto-incremented remotely.</text>
<text x="54.0" y="717.5" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">eas submit → Play internal testing track (internal testers use PRODUCTION data).</text>
<text x="54.0" y="737.3" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Promote to closed/open testing or production in Play Console; Google review applies.</text>
<text x="54.0" y="757.1" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">The CI build-production job is disabled (if: false).</text>
<rect x="780.0" y="620.5" width="740.0" height="155.4" rx="12" fill="#F1F2F4" stroke="#4A5260" stroke-width="2"/>
<text x="794.0" y="651.5" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#4A5260" text-anchor="start">7. Phones</text>
<text x="794.0" y="677.9" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Over-the-air updates are disabled (updates.enabled: false): JavaScript and native changes</text>
<text x="794.0" y="697.7" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">reach users only when they install a new build.</text>
<text x="794.0" y="717.5" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Pushing main never changes an installed app. A backend change reaches existing installs</text>
<text x="794.0" y="737.3" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">immediately, so it must stay compatible with older builds (e.g. orders without localId).</text>
<text x="794.0" y="757.1" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Voice needs the new native build (Kotlin module, minSdk 26).</text>
<path d="M 740.0 698.2 L 780.0 698.2" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
</svg>
