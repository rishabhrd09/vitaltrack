<svg width="1000" height="548" viewBox="0 0 1000 548" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pyramid-t pyramid-d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title id="pyramid-t">Testing pyramid</title><desc id="pyramid-d">Many fast backend unit and API tests at the base, API integration tests against PostgreSQL 16 in CI in the middle, and a few manual end-to-end checks on a real device with a preview APK at the top.</desc><defs></defs>
