<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1768" width="1560" height="1768" role="img" aria-labelledby="t d">
<title id="t">Login, token refresh and logout</title>
<desc id="d">Login returns a 30-minute access token and a 30-day refresh token, stored in the phone&#x27;s secure store. When a request gets 401, the app makes one shared refresh call; the server claims the old refresh token with a conditional update and issues a new pair. Logout clears local credentials without waiting for best-effort server revocation. The access token keeps working until it expires. A password change or reset increases the user&#x27;s session_version, which invalidates every older token at once.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2B3138"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 10 0 L 0 5 L 10 10 z" fill="#2B3138"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="40.0" y="52.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#16191D" text-anchor="start">Sessions: login, refresh rotation, logout and password change</text>
<text x="40.0" y="84.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#4A5260" text-anchor="start">Access token: JWT, 30 min, checked on protected bearer routes (signature, type, session_version). Refresh token: JWT + a row in refresh_tokens, 30 days, single use.</text>
<rect x="52.0" y="120.0" width="272.0" height="64.0" rx="12" fill="#E7F0FB" stroke="#1F5FA8" stroke-width="2"/>
<text x="188.0" y="150.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#1F5FA8" text-anchor="middle">Screens + auth store</text>
<rect x="348.0" y="120.0" width="272.0" height="64.0" rx="12" fill="#E7F0FB" stroke="#1F5FA8" stroke-width="2"/>
<text x="484.0" y="150.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#1F5FA8" text-anchor="middle">services/api.ts</text>
<rect x="644.0" y="120.0" width="272.0" height="64.0" rx="12" fill="#F1F2F4" stroke="#4A5260" stroke-width="2"/>
<text x="780.0" y="150.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#4A5260" text-anchor="middle">SecureStore (phone)</text>
<rect x="940.0" y="120.0" width="272.0" height="64.0" rx="12" fill="#E7F0FB" stroke="#1F5FA8" stroke-width="2"/>
<text x="1076.0" y="150.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#1F5FA8" text-anchor="middle">FastAPI auth routes</text>
<rect x="1236.0" y="120.0" width="272.0" height="64.0" rx="12" fill="#FFF3DB" stroke="#8F5B00" stroke-width="2"/>
<text x="1372.0" y="150.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#8F5B00" text-anchor="middle">PostgreSQL</text>
<line x1="188.0" y1="184.0" x2="188.0" y2="1728.3" stroke="#9AA2AE" stroke-width="1.6" stroke-dasharray="6 6"/>
<line x1="484.0" y1="184.0" x2="484.0" y2="1728.3" stroke="#9AA2AE" stroke-width="1.6" stroke-dasharray="6 6"/>
<line x1="780.0" y1="184.0" x2="780.0" y2="1728.3" stroke="#9AA2AE" stroke-width="1.6" stroke-dasharray="6 6"/>
<line x1="1076.0" y1="184.0" x2="1076.0" y2="1728.3" stroke="#9AA2AE" stroke-width="1.6" stroke-dasharray="6 6"/>
<line x1="1372.0" y1="184.0" x2="1372.0" y2="1728.3" stroke="#9AA2AE" stroke-width="1.6" stroke-dasharray="6 6"/>
<line x1="30.0" y1="208.0" x2="1530.0" y2="208.0" stroke="#C9CED6" stroke-width="1.2"/>
<text x="44.0" y="230.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#4A5260" text-anchor="start" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">Login</text>
<path d="M 188.0 262.0 L 1068.0 262.0" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="632.0" y="252.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">1. POST /auth/login {identifier, password}</text>
<path d="M 1076.0 338.8 L 1364.0 338.8" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="1224.0" y="310.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">2. SELECT user … FOR UPDATE</text>
<text x="1224.0" y="328.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">Argon2 check in a worker thread</text>
<path d="M 1076.0 415.5 L 1364.0 415.5" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="1224.0" y="386.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">3. INSERT refresh_tokens(R1) · last_login</text>
<text x="1224.0" y="405.5" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">USER_LOGIN activity · COMMIT</text>
<path d="M 1076.0 473.5 L 196.0 473.5" fill="none" stroke="#2B3138" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="632.0" y="463.5" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">4. 200 {access A1, refresh R1, user}</text>
<path d="M 188.0 531.5 L 772.0 531.5" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="484.0" y="521.5" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">5. save A1, R1 · clear old query cache · open the tabs</text>
<line x1="30.0" y1="579.5" x2="1530.0" y2="579.5" stroke="#C9CED6" stroke-width="1.2"/>
<text x="44.0" y="601.5" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#4A5260" text-anchor="start" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">A request after the access token expired</text>
<path d="M 484.0 633.5 L 1068.0 633.5" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="780.0" y="623.5" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">6. GET /items  Bearer A1</text>
<path d="M 1076.0 691.5 L 492.0 691.5" fill="none" stroke="#2B3138" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="780.0" y="681.5" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">7. 401 Invalid or expired token</text>
<path d="M 484.0 749.5 L 1068.0 749.5" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="780.0" y="739.5" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">8. ONE shared POST /auth/refresh {R1} (30 s limit) for every waiting request</text>
<path d="M 1076.0 845.0 L 1364.0 845.0" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="1224.0" y="797.5" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">9. lock user · check session_version</text>
<text x="1224.0" y="816.2" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">claim R1: UPDATE … SET is_revoked</text>
<text x="1224.0" y="835.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">WHERE jti=R1 AND NOT revoked</text>
<path d="M 1076.0 903.0 L 1364.0 903.0" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="1224.0" y="893.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">10. INSERT R2 · COMMIT</text>
<path d="M 1076.0 961.0 L 492.0 961.0" fill="none" stroke="#2B3138" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="780.0" y="951.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">11. 200 {A2, R2}</text>
<path d="M 484.0 1019.0 L 772.0 1019.0" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="632.0" y="1009.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">12. save A2, R2 only if the credential generation still matches · retry GET once</text>
<rect x="359.7" y="1059.0" width="840.6" height="59.6" rx="8" fill="#FFF8D6" stroke="#7A6A00" stroke-width="1.6"/>
<text x="369.7" y="1084.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Refresh answered 401/403 → tokens cleared and the store logs out. Timeout or 5xx → tokens kept, the request</text>
<text x="369.7" y="1103.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">fails, a later call can retry. Replaying R1 → 401, but R2 stays valid (no theft detection).</text>
<line x1="30.0" y1="1152.6" x2="1530.0" y2="1152.6" stroke="#C9CED6" stroke-width="1.2"/>
<text x="44.0" y="1174.6" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#4A5260" text-anchor="start" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">Logout</text>
<path d="M 188.0 1206.6 L 772.0 1206.6" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="484.0" y="1196.6" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">13. capture A2, R2 · clear local tokens; clear query cache (memory and disk)</text>
<path d="M 188.0 1264.6 L 1068.0 1264.6" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="632.0" y="1254.6" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">14. best effort: POST /auth/logout {R2} Bearer A2 (30 s overall; detached)</text>
<path d="M 1076.0 1322.6 L 1364.0 1322.6" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="1224.0" y="1312.6" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">15. if accepted: revoke R2 · USER_LOGOUT · COMMIT</text>
<rect x="63.7" y="1362.6" width="1136.6" height="59.6" rx="8" fill="#FFF8D6" stroke="#7A6A00" stroke-width="1.6"/>
<text x="73.7" y="1387.6" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">The login screen appears immediately. New login waits only for local cleanup, not the server. Expired A2: rotate the captured pair in memory,</text>
<text x="73.7" y="1407.4" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">then revoke it; never write it over a new login. Offline revocation can fail; logout is still complete on the phone.</text>
<rect x="951.7" y="1448.2" width="544.6" height="59.6" rx="8" fill="#FCEBEA" stroke="#A8261D" stroke-width="1.6"/>
<text x="961.7" y="1473.2" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">A2 still works until it expires (≤ 30 min): logout does not change</text>
<text x="961.7" y="1493.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">session_version. Reproduced 7 Oct and re-run 8 Oct 2026.</text>
<line x1="30.0" y1="1541.8" x2="1530.0" y2="1541.8" stroke="#C9CED6" stroke-width="1.2"/>
<text x="44.0" y="1563.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#4A5260" text-anchor="start" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">Password change or reset</text>
<path d="M 1076.0 1614.5 L 1364.0 1614.5" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="1224.0" y="1585.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">16. session_version + 1 · revoke all</text>
<text x="1224.0" y="1604.5" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">refresh rows · clear reset/deletion tokens</text>
<rect x="359.7" y="1654.5" width="1136.6" height="39.8" rx="8" fill="#E7F0FB" stroke="#1F5FA8" stroke-width="1.6"/>
<text x="369.7" y="1679.5" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Every token issued before carries the old session_version → 401 on its next use; the app&#x27;s refresh then fails and it logs out.</text>
</svg>
