<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1094" width="1500" height="1094" role="img" aria-labelledby="t d">
<title id="t">Two clients save the same item</title>
<desc id="d">Client A and client B both loaded the item at version 3. Each sends a stock update naming version 3 (the API-only PATCH used by the reproduction). PostgreSQL lets the first UPDATE take the row lock and commit version 4; the second UPDATE re-checks its WHERE clause after waiting, matches no row, and the API returns 409 with the values it had read. The app&#x27;s Edit Item sends PUT with the item name, which first takes a per-account advisory lock, so a second PUT waits before its SELECT; the outcome is the same. The app now captures the version with its form values; a cache refresh cannot replace it (A-1 fixed locally on 8 October 2026).</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2B3138"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 10 0 L 0 5 L 10 10 z" fill="#2B3138"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="40.0" y="52.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#16191D" text-anchor="start">Optimistic concurrency: the version column</text>
<text x="40.0" y="84.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#4A5260" text-anchor="start">PUT /items/{id} and PATCH /items/{id}/stock both run UPDATE … WHERE version = :seen. Reproduced 7 and 8 Oct with two stock PATCH calls: one 200, one 409.</text>
<rect x="52.0" y="120.0" width="331.0" height="64.0" rx="12" fill="#F1F2F4" stroke="#4A5260" stroke-width="2"/>
<text x="217.5" y="150.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#4A5260" text-anchor="middle">Client A (API test)</text>
<rect x="407.0" y="120.0" width="331.0" height="64.0" rx="12" fill="#F1F2F4" stroke="#4A5260" stroke-width="2"/>
<text x="572.5" y="150.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#4A5260" text-anchor="middle">Client B (API test)</text>
<rect x="762.0" y="120.0" width="331.0" height="64.0" rx="12" fill="#E7F0FB" stroke="#1F5FA8" stroke-width="2"/>
<text x="927.5" y="150.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#1F5FA8" text-anchor="middle">API worker(s)</text>
<rect x="1117.0" y="120.0" width="331.0" height="64.0" rx="12" fill="#FFF3DB" stroke="#8F5B00" stroke-width="2"/>
<text x="1282.5" y="150.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#8F5B00" text-anchor="middle">PostgreSQL items row</text>
<line x1="217.5" y1="184.0" x2="217.5" y2="1054.0" stroke="#9AA2AE" stroke-width="1.6" stroke-dasharray="6 6"/>
<line x1="572.5" y1="184.0" x2="572.5" y2="1054.0" stroke="#9AA2AE" stroke-width="1.6" stroke-dasharray="6 6"/>
<line x1="927.5" y1="184.0" x2="927.5" y2="1054.0" stroke="#9AA2AE" stroke-width="1.6" stroke-dasharray="6 6"/>
<line x1="1282.5" y1="184.0" x2="1282.5" y2="1054.0" stroke="#9AA2AE" stroke-width="1.6" stroke-dasharray="6 6"/>
<rect x="68.4" y="200.0" width="653.2" height="39.8" rx="8" fill="#FFF8D6" stroke="#7A6A00" stroke-width="1.6"/>
<text x="78.4" y="225.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Both clients read Nitrile gloves: quantity 40, version 3</text>
<path d="M 217.5 283.8 L 919.5 283.8" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="572.5" y="273.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">1. PATCH /items/{id}/stock {&quot;quantity&quot;:38,&quot;version&quot;:3}</text>
<path d="M 572.5 341.8 L 919.5 341.8" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="750.0" y="331.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">2. PATCH /items/{id}/stock {&quot;quantity&quot;:36,&quot;version&quot;:3}</text>
<path d="M 927.5 399.8 L 1274.5 399.8" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="1105.0" y="389.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">3. A: UPDATE … SET quantity=38, version=version+1 WHERE … AND version=3</text>
<path d="M 927.5 457.8 L 1274.5 457.8" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="1105.0" y="447.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">4. B: same UPDATE with version=3 → waits for A&#x27;s row lock</text>
<path d="M 927.5 515.8 L 1274.5 515.8" fill="none" stroke="#2B3138" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="1105.0" y="505.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">5. A: INSERT activity + audit · COMMIT (row now version 4)</text>
<path d="M 1282.5 573.8 L 935.5 573.8" fill="none" stroke="#2B3138" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="1105.0" y="563.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">6. B: lock released → WHERE re-checked → version is 4 → 0 rows</text>
<path d="M 927.5 631.8 L 225.5 631.8" fill="none" stroke="#2B3138" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="572.5" y="621.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">7. 200 · quantity 38 · version 4</text>
<path d="M 927.5 689.8 L 580.5 689.8" fill="none" stroke="#A8261D" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="750.0" y="679.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#16191D" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">8. 409 {&quot;error&quot;:&quot;Version conflict&quot;,&quot;server_version&quot;:…,&quot;server_quantity&quot;:…}</text>
<rect x="423.4" y="729.8" width="653.2" height="99.2" rx="8" fill="#FCEBEA" stroke="#A8261D" stroke-width="1.6"/>
<text x="433.4" y="754.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">The 409 body carries the values read at the start of B&#x27;s request, which may</text>
<text x="433.4" y="774.6" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">already be out of date. The app shows the server message and invalidates affected</text>
<text x="433.4" y="794.4" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">active queries. Reopen the form for current values; Retry retains its original</text>
<text x="433.4" y="814.2" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">version.</text>
<rect x="68.4" y="855.0" width="1363.2" height="79.4" rx="8" fill="#E7F0FB" stroke="#1F5FA8" stroke-width="1.6"/>
<text x="78.4" y="880.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">Why this is safe: under PostgreSQL&#x27;s default READ COMMITTED isolation, a blocked UPDATE re-evaluates its WHERE clause against the newest row version. No SELECT … FOR UPDATE is</text>
<text x="78.4" y="899.8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">needed for this compare-and-swap. The lock wait shown is one possible interleaving; the reproduction checks the outcome. Ordinary item deletes have no version check. Resets</text>
<text x="78.4" y="919.6" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">opt into a version check under a row lock.</text>
<rect x="68.4" y="960.4" width="1363.2" height="59.6" rx="8" fill="#FFF8D6" stroke="#7A6A00" stroke-width="1.6"/>
<text x="78.4" y="985.4" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">In the app: Edit Item sends PUT /items/{id} with the item name, which first takes a per-account advisory lock. A second PUT waits there until the first commits, then its</text>
<text x="78.4" y="1005.2" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#16191D" text-anchor="start">SELECT sees version 4 and its UPDATE matches no row: the same 200 / 409 result, without the row-lock wait.</text>
</svg>
