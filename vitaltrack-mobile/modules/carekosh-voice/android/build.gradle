plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.carekoshvoice'
version = '1.0.0'

android {
  namespace 'expo.modules.carekoshvoice'
  defaultConfig {
    minSdkVersion 26
    versionCode 1
    versionName '1.0.0'
  }
}

repositories { google(); mavenCentral() }
dependencies {
  // Pin the native runtime and its embedded model catalog together.
  implementation 'ai.moonshine:moonshine-voice:0.1.5'
  // Separate from Moonshine's ONNX library; no eSpeak/phonemizer runtime.
  implementation 'com.google.ai.edge.litert:litert:2.1.6'
}
