<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1749" width="1000" height="1749" role="img" aria-labelledby="request-journey-title request-journey-desc">
<title id="request-journey-title">One tap, end to end: saving an edited item</title>
<desc id="request-journey-desc">The Edit Item screen calls the update mutation and closes. The API client adds the access token and sends PUT /api/v1/items/{id} over HTTPS. On Render a Uvicorn worker runs the middleware; FastAPI parses the JSON, loads the user through its dependencies and then validates the fields. Because the body names the item, the handler first takes the account&#x27;s name lock, then checks ownership, runs a compare-and-swap UPDATE, writes activity and audit rows and commits. The response returns, and the app invalidates its item and activity lists and fetches them again.</desc>
<style data-fonts="standalone">@import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&amp;family=STIX+Two+Text:ital,wght@0,400..700;1,400..700&amp;display=swap");</style>
