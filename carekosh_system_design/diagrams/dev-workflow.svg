<path d="M43.0,1078.9 H944.0 Q960.0,1078.9 960.0,1094.9 V1168.0 Q960.0,1184.0 944.0,1184.0 H43.0 Q40.0,1184.0 40.0,1181.0 V1081.9 Q40.0,1078.9 43.0,1078.9 Z" fill="#F4E4DA" stroke="#B2423B" stroke-width="1.4"/>
<text x="58.0" y="1106.9" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#B2423B" text-anchor="start" letter-spacing="1.6">BEFORE YOU MERGE</text>
<text x="58.0" y="1136.9" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18" font-weight="400" fill="#4B3E35" text-anchor="start">0007 blocks automatic downgrade below it: test fresh schema and a synthetic 0006 upgrade and follow the release gate</text>
<text x="58.0" y="1162.5" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18" font-weight="400" fill="#4B3E35" text-anchor="start">before merging. Mobile changes reach people only through a new build.</text>
