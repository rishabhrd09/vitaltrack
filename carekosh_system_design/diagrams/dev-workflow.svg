<text x="522.2" y="789.1" font-family="'STIX Two Text', 'Cambria Math', 'Times New Roman', serif" font-size="17.92" font-weight="500" fill="#FBF6EC" text-anchor="middle">10</text>
<text x="549.2" y="793.5" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="21" font-weight="600" fill="#B2423B" text-anchor="start">Merge to main</text>
<text x="507.2" y="823.3" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18" font-weight="400" fill="#4B3E35" text-anchor="start">production deploy if auto-deploy or hook configured;</text>
<text x="507.2" y="848.9" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18" font-weight="400" fill="#4B3E35" text-anchor="start">migrations run at container start</text>
<path d="M718.6,724.2 L718.6,752.2" fill="none" stroke="#7B2C34" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dev-workflow-ah-main)"/>
<rect x="489.2" y="907.6" width="458.8" height="117.4" rx="12" fill="#EAE9D8" stroke="#557629" stroke-width="1.8"/>
