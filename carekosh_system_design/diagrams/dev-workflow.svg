<text x="522.2" y="511.9" font-family="'STIX Two Text', 'Cambria Math', 'Times New Roman', serif" font-size="17.92" font-weight="500" fill="#FBF6EC" text-anchor="middle">8</text>
<text x="549.2" y="516.3" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="21" font-weight="600" fill="#6B3A6E" text-anchor="start">Optional: label build-apk</text>
<text x="507.2" y="546.2" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18" font-weight="400" fill="#4B3E35" text-anchor="start">an EAS preview APK that talks to staging</text>
<path d="M718.6,447.0 L718.6,475.0" fill="none" stroke="#6B3A6E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#dev-workflow-ah-optional)"/>
<rect x="489.2" y="604.8" width="458.8" height="117.4" rx="12" fill="#EDE7DC" stroke="#6E5D4E" stroke-width="1.8"/>
