<text x="56.0" y="688.7" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#557629" text-anchor="start" letter-spacing="1.6">PHONE OR EMULATOR · CHOOSE THE SHELL INDEPENDENTLY OF THE CONNECTION</text>
<path d="M43.0,931.6 H944.0 Q960.0,931.6 960.0,947.6 V1020.8 Q960.0,1036.8 944.0,1036.8 H43.0 Q40.0,1036.8 40.0,1033.8 V934.6 Q40.0,931.6 43.0,931.6 Z" fill="#F4E4DA" stroke="#B2423B" stroke-width="1.4"/>
<text x="58.0" y="959.6" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#B2423B" text-anchor="start" letter-spacing="1.6">TESTS NEVER USE THIS DATABASE</text>
<text x="58.0" y="989.6" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18" font-weight="400" fill="#4B3E35" text-anchor="start">Backend tests drop and recreate every table. Run them only against a separate, disposable local database whose name</text>
<text x="58.0" y="1015.2" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18" font-weight="400" fill="#4B3E35" text-anchor="start">contains “test”, never this one.</text>
</svg>
