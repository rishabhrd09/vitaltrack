<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1040" width="1000" height="1040" role="img" aria-labelledby="async-model-title async-model-desc">
<title id="async-model-title">How one backend instance runs</title>
<desc id="async-model-desc">Gunicorn starts two Uvicorn worker processes. Each worker has one event loop that interleaves many requests while they wait on PostgreSQL through an asyncpg pool of 5 plus up to 10 overflow connections, or on Brevo and Groq over httpx. Argon2 password hashing runs in a worker thread so the loop keeps serving. The timeline is an illustration, not a measurement.</desc>
