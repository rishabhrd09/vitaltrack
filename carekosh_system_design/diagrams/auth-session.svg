<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1781" width="1000" height="1781" role="img" aria-labelledby="auth-session-title auth-session-desc">
<title id="auth-session-title">Signing in and staying signed in</title>
<desc id="auth-session-desc">Login returns a 30-minute access token and a 30-day refresh token, stored in SecureStore. Every request sends the access token; the server checks it and the user row. When it expires the app makes one shared refresh call; the server claims the old refresh token with a conditional update and issues a new pair. Logout clears local credentials without waiting for best-effort server revocation (30 s overall). Server logout revokes the refresh token only. A password change or reset increases session_version, which invalidates every older token.</desc>
<style data-fonts="standalone">@import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&amp;family=STIX+Two+Text:ital,wght@0,400..700;1,400..700&amp;display=swap");</style>
