<text x="112.0" y="1472.3" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="21" font-weight="600" fill="#B2423B" text-anchor="start">Logout</text>
<text x="70.0" y="1502.1" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18" font-weight="400" fill="#4B3E35" text-anchor="start">clear phone tokens and caches; captured credentials are revoked separately,</text>
<text x="70.0" y="1527.7" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18" font-weight="400" fill="#4B3E35" text-anchor="start">best effort (30 s). New login waits only for local cleanup. Existing access</text>
<text x="70.0" y="1553.2" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18" font-weight="400" fill="#4B3E35" text-anchor="start">tokens still expire normally (at most 30 min).</text>
