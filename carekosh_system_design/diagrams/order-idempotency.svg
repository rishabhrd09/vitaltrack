<text x="58.0" y="1403.0" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18" font-weight="400" fill="#4B3E35" text-anchor="start">Requests without a localId (app builds older than this branch) always create a new order. A new confirmed submission</text>
<text x="58.0" y="1428.6" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18" font-weight="400" fill="#4B3E35" text-anchor="start">uses a new key; an uncertain submission retains its original key. The index preserves later legacy duplicate rows by</text>
<text x="58.0" y="1454.1" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18" font-weight="400" fill="#4B3E35" text-anchor="start">exempting their ids; a replay with changed data still returns the original.</text>
