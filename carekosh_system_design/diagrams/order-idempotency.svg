<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1505" width="1000" height="1505" role="img" aria-labelledby="order-idempotency-title order-idempotency-desc">
<title id="order-idempotency-title">Order creation and retries</title>
<desc id="order-idempotency-desc">The app generates one localId per Save. A retry with the same localId returns the order already created with status 200. Two identical requests at the same moment collide on a partial unique index; the loser rolls back, which also releases its order number, and returns the winner&#x27;s order. Requests without a localId, such as those from older app builds, always create a new order.</desc>
