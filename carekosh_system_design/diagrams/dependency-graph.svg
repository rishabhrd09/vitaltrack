<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1139" width="1000" height="1139" role="img" aria-labelledby="dependency-graph-title dependency-graph-desc">
<title id="dependency-graph-title">FastAPI dependencies used by a protected route</title>
<desc id="dependency-graph-desc">A protected route asks for CurrentUser and DB. get_current_user needs the bearer token and get_db; FastAPI caches get_db per request, so the user is loaded through the handler&#x27;s own session. get_db opens one shared business AsyncSession per request, finishes its remaining transaction at teardown and cannot undo earlier commits. AI routes use a separate Principal dependency that opens short sessions of its own.</desc>
<style data-fonts="standalone">@import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&amp;family=STIX+Two+Text:ital,wght@0,400..700;1,400..700&amp;display=swap");</style>
<defs><pattern id="dependency-graph-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.15" fill="#CDBB9C" opacity="0.6"/></pattern><marker id="dependency-graph-ah-flow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 L2.4,5 Z" fill="#4B3E35"/></marker><marker id="dependency-graph-ah-main" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 L2.4,5 Z" fill="#7B2C34"/></marker></defs>
<rect width="100%" height="100%" fill="#FBF6EC"/>
<rect width="100%" height="100%" fill="url(#dependency-graph-dots)"/>
<text x="40.0" y="58.0" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="30" font-weight="500" fill="#1A1512" text-anchor="start">What FastAPI builds before your handler runs</text>
<text x="40.0" y="98.3" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18.5" font-weight="400" fill="#7C6B5C" text-anchor="start" font-style="italic">Arrows point from a function to what it needs. FastAPI resolves this graph once per request.</text>
<rect x="40.0" y="126.3" width="920.0" height="117.4" rx="12" fill="#EEE2DA" stroke="#7B2C34" stroke-width="1.8"/>
<text x="58.0" y="163.6" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="21" font-weight="600" fill="#7B2C34" text-anchor="start">Route · PUT /api/v1/items/{item_id}</text>
<text x="58.0" y="193.4" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="16.2" font-weight="400" fill="#4B3E35" text-anchor="start">async def update_item(item_id: str, data: ItemUpdate, db: DB, current_user:</text>
<text x="58.0" y="219.0" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="16.2" font-weight="400" fill="#4B3E35" text-anchor="start">CurrentUser)</text>
<rect x="40.0" y="313.6" width="290.7" height="168.5" rx="12" fill="#EBDDC6" stroke="#D3BF9E" stroke-width="1.4"/>
<text x="58.0" y="351.0" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="21" font-weight="600" fill="#1A1512" text-anchor="start">item_id + ItemUpdate</text>
<text x="58.0" y="380.8" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18" font-weight="400" fill="#4B3E35" text-anchor="start">path parameter and JSON body</text>
<text x="58.0" y="406.3" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18" font-weight="400" fill="#4B3E35" text-anchor="start">validated after DB and</text>
<text x="58.0" y="431.9" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18" font-weight="400" fill="#4B3E35" text-anchor="start">CurrentUser resolve: bad input →</text>
<text x="58.0" y="457.5" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18" font-weight="400" fill="#4B3E35" text-anchor="start">422</text>
<path d="M185.3,246.6 L185.3,308.6" fill="none" stroke="#4B3E35" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dependency-graph-ah-flow)"/>
<rect x="354.7" y="313.6" width="290.7" height="168.5" rx="12" fill="#E6E6E0" stroke="#2E5677" stroke-width="1.8"/>
<text x="372.7" y="351.0" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="21" font-weight="600" fill="#2E5677" text-anchor="start">DB</text>
<text x="372.7" y="380.8" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="16.2" font-weight="400" fill="#4B3E35" text-anchor="start">Annotated[AsyncSession,</text>
<text x="372.7" y="406.3" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="16.2" font-weight="400" fill="#4B3E35" text-anchor="start">Depends(get_db)]</text>
<path d="M500.0,246.6 L500.0,308.6" fill="none" stroke="#4B3E35" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dependency-graph-ah-flow)"/>
<rect x="669.3" y="313.6" width="290.7" height="168.5" rx="12" fill="#E6E6E0" stroke="#2E5677" stroke-width="1.8"/>
<text x="687.3" y="351.0" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="21" font-weight="600" fill="#2E5677" text-anchor="start">CurrentUser</text>
<text x="687.3" y="380.8" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="16.2" font-weight="400" fill="#4B3E35" text-anchor="start">Annotated[User,</text>
<text x="687.3" y="406.3" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="16.2" font-weight="400" fill="#4B3E35" text-anchor="start">Depends(get_current_user)]</text>
<path d="M814.7,246.6 L814.7,308.6" fill="none" stroke="#4B3E35" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dependency-graph-ah-flow)"/>
<rect x="354.7" y="552.1" width="290.7" height="267.2" rx="12" fill="#E6E6E0" stroke="#2E5677" stroke-width="1.8"/>
<text x="372.7" y="581.1" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#2E5677" text-anchor="start" letter-spacing="1.6">CORE/DATABASE.PY</text>
<text x="372.7" y="611.5" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="21" font-weight="600" fill="#2E5677" text-anchor="start">get_db()</text>
<text x="372.7" y="641.3" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18" font-weight="400" fill="#4B3E35" text-anchor="start">creates AsyncSessionLocal();</text>
<text x="372.7" y="666.8" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18" font-weight="400" fill="#4B3E35" text-anchor="start">connection on first SQL</text>
<text x="372.7" y="692.4" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18" font-weight="400" fill="#4B3E35" text-anchor="start">teardown: commit remaining</text>
<text x="372.7" y="718.0" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18" font-weight="400" fill="#4B3E35" text-anchor="start">transaction</text>
<text x="372.7" y="743.5" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18" font-weight="400" fill="#4B3E35" text-anchor="start">on error: rollback uncommitted</text>
<text x="372.7" y="769.1" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18" font-weight="400" fill="#4B3E35" text-anchor="start">work only</text>
<text x="372.7" y="794.6" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18" font-weight="400" fill="#4B3E35" text-anchor="start">always: close</text>
<rect x="669.3" y="552.1" width="290.7" height="267.2" rx="12" fill="#E6E6E0" stroke="#2E5677" stroke-width="1.8"/>
<text x="687.3" y="581.1" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#2E5677" text-anchor="start" letter-spacing="1.6">API/DEPS.PY</text>
<text x="687.3" y="611.5" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="21" font-weight="600" fill="#2E5677" text-anchor="start">get_current_user()</text>
<text x="687.3" y="641.3" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18" font-weight="400" fill="#4B3E35" text-anchor="start">decode the JWT (type access)</text>
<text x="687.3" y="666.8" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18" font-weight="400" fill="#4B3E35" text-anchor="start">SELECT the user (noload)</text>
<text x="687.3" y="692.4" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18" font-weight="400" fill="#4B3E35" text-anchor="start">session_version, is_active,</text>
<text x="687.3" y="718.0" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18" font-weight="400" fill="#4B3E35" text-anchor="start">verification → 401 / 403</text>
<path d="M500.0,485.1 L500.0,547.1" fill="none" stroke="#4B3E35" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dependency-graph-ah-flow)"/>
<path d="M814.7,485.1 L814.7,547.1" fill="none" stroke="#4B3E35" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dependency-graph-ah-flow)"/>
<path d="M729.3,822.3 L729.3,857.3 Q729.3,867.3 719.3,867.3 L510.0,867.3 Q500.0,867.3 500.0,857.3 L500.0,824.3" fill="none" stroke="#7B2C34" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dependency-graph-ah-main)"/>
<text x="614.7" y="897.3" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="16" font-weight="400" fill="#7B2C34" text-anchor="middle" font-style="italic">get_current_user needs get_db too; FastAPI caches it,</text>
<text x="614.7" y="919.3" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="16" font-weight="400" fill="#7B2C34" text-anchor="middle" font-style="italic">so both share the request&#x27;s one session</text>
<rect x="669.3" y="943.3" width="290.7" height="132.8" rx="12" fill="#EDE7DC" stroke="#6E5D4E" stroke-width="1.8"/>
<text x="687.3" y="977.9" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18" font-weight="600" fill="#6E5D4E" text-anchor="start">HTTPBearer(auto_error=False)</text>
<text x="687.3" y="1005.1" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="16.5" font-weight="400" fill="#4B3E35" text-anchor="start">reads Authorization: Bearer &lt;token&gt;;</text>
<text x="687.3" y="1028.6" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="16.5" font-weight="400" fill="#4B3E35" text-anchor="start">missing → 401 from</text>
<text x="687.3" y="1052.0" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="16.5" font-weight="400" fill="#4B3E35" text-anchor="start">get_current_user</text>
<path d="M920.0,822.3 L920.0,938.3" fill="none" stroke="#4B3E35" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dependency-graph-ah-flow)"/>
<rect x="40.0" y="943.3" width="605.3" height="160.0" rx="12" fill="#EDE3DF" stroke="#6B3A6E" stroke-width="1.8" stroke-dasharray="7 6"/>
<text x="58.0" y="980.6" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="21" font-weight="600" fill="#6B3A6E" text-anchor="start">AI routes are different</text>
<text x="58.0" y="1008.9" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="16.5" font-weight="400" fill="#4B3E35" text-anchor="start">Principal = Annotated[AIPrincipal, Depends(principal)]: principal() opens its own</text>
<text x="58.0" y="1032.3" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="16.5" font-weight="400" fill="#4B3E35" text-anchor="start">short session, calls get_current_user and returns only the user id.</text>
<text x="58.0" y="1055.7" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="16.5" font-weight="400" fill="#4B3E35" text-anchor="start">reserve() and settle() use short transactions of their own, so no connection is held</text>
<text x="58.0" y="1079.2" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="16.5" font-weight="400" fill="#4B3E35" text-anchor="start">while waiting up to 25 s for Groq.</text>
</svg>
