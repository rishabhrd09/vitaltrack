<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1666" width="1000" height="1666" role="img" aria-labelledby="request-lifecycle-title request-lifecycle-desc">
<title id="request-lifecycle-title">Inside the server: one request, step by step</title>
<desc id="request-lifecycle-desc">A close-up of the server side of PUT /api/v1/items/{id}. The middleware reads the body and notes the request id; FastAPI matches the route and parses the JSON; dependencies create a session and load the user, then the fields are validated, all before the handler. The handler takes the account&#x27;s name lock, checks ownership, runs a compare-and-swap UPDATE, writes history rows and commits. db.refresh then reads the row in a new transaction, the response is serialised in camelCase, and get_db commits that read and closes the session; headers are added on the way out.</desc>
<style data-fonts="standalone">@import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&amp;family=STIX+Two+Text:ital,wght@0,400..700;1,400..700&amp;display=swap");</style>
