<circle cx="85.0" cy="828.1" r="16" fill="#7B2C34"/>
<text x="85.0" y="834.2" font-family="'STIX Two Text', 'Cambria Math', 'Times New Roman', serif" font-size="17.92" font-weight="500" fill="#FBF6EC" text-anchor="middle">5</text>
<text x="112.0" y="838.6" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="21" font-weight="600" fill="#6E5D4E" text-anchor="start">Every container start</text>
<text x="70.0" y="868.5" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18" font-weight="400" fill="#4B3E35" text-anchor="start">wait for PostgreSQL → alembic upgrade head →</text>
<text x="70.0" y="894.0" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18" font-weight="400" fill="#4B3E35" text-anchor="start">Gunicorn → Render checks /live</text>
