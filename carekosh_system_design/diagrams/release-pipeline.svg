<text x="587.7" y="269.0" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18" font-weight="400" fill="#4B3E35" text-anchor="start">--profile production → AAB; versionCode set</text>
<text x="587.7" y="294.5" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18" font-weight="400" fill="#4B3E35" text-anchor="start">remotely</text>
<rect x="569.7" y="349.2" width="378.3" height="117.4" rx="12" fill="#EAE9D8" stroke="#557629" stroke-width="1.8"/>
<circle cx="602.7" cy="376.0" r="16" fill="#7B2C34"/>
<text x="602.7" y="382.1" font-family="'STIX Two Text', 'Cambria Math', 'Times New Roman', serif" font-size="17.92" font-weight="500" fill="#FBF6EC" text-anchor="middle">2</text>
<text x="629.7" y="386.5" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="21" font-weight="600" fill="#557629" text-anchor="start">Play internal testing</text>
