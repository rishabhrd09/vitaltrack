<text x="112.0" y="543.9" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="21" font-weight="600" fill="#2E5677" text-anchor="start">Staging candidate</text>
<text x="70.0" y="573.7" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18" font-weight="400" fill="#4B3E35" text-anchor="start">deployed by hand (dashboard service, not verified) with its</text>
<text x="70.0" y="599.3" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18" font-weight="400" fill="#4B3E35" text-anchor="start">own database; a preview APK calls staging</text>
<path d="M285.9,478.6 L285.9,502.6" fill="none" stroke="#4B3E35" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#release-pipeline-ah-flow)"/>
