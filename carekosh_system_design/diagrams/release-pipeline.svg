<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1122" width="1000" height="1122" role="img" aria-labelledby="release-pipeline-title release-pipeline-desc">
<title id="release-pipeline-title">From a merged change to users</title>
<desc id="release-pipeline-desc">The backend and the Android app are released separately. Backend: a pull request runs CI, a staging candidate is deployed through the staging service (dashboard settings not verified), and merging can deploy production if a trigger is configured; every container start migrates the database first. App: an EAS production build is uploaded to Play internal testing, then promoted; installed apps only change when people install the new build.</desc>
<style data-fonts="standalone">@import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&amp;family=STIX+Two+Text:ital,wght@0,400..700;1,400..700&amp;display=swap");</style>
<defs><pattern id="release-pipeline-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.15" fill="#CDBB9C" opacity="0.6"/></pattern><marker id="release-pipeline-ah-flow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 L2.4,5 Z" fill="#4B3E35"/></marker><marker id="release-pipeline-ah-main" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 L2.4,5 Z" fill="#7B2C34"/></marker></defs>
<rect width="100%" height="100%" fill="#FBF6EC"/>
<rect width="100%" height="100%" fill="url(#release-pipeline-dots)"/>
<text x="40.0" y="58.0" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="30" font-weight="500" fill="#1A1512" text-anchor="start">From a merged change to users</text>
<text x="40.0" y="98.3" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18.5" font-weight="400" fill="#7C6B5C" text-anchor="start" font-style="italic">Two separate pipelines. Built is not deployed; deployed is not healthy; healthy is not proof of the commit.</text>
<rect x="40.0" y="122.3" width="491.7" height="969.8" rx="14" fill="#F2EFE7" stroke="#C2C9CB" stroke-width="1.2"/>
<rect x="557.7" y="122.3" width="402.3" height="969.8" rx="14" fill="#F4F0E3" stroke="#CDD2B5" stroke-width="1.2"/>
<text x="56.0" y="152.3" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#2E5677" text-anchor="start" letter-spacing="1.6">BACKEND</text>
<text x="573.7" y="152.3" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#557629" text-anchor="start" letter-spacing="1.6">ANDROID APP</text>
<rect x="52.0" y="176.3" width="467.7" height="91.8" rx="12" fill="#EDE7DC" stroke="#6E5D4E" stroke-width="1.8"/>
<circle cx="85.0" cy="203.1" r="16" fill="#7B2C34"/>
<text x="85.0" y="209.2" font-family="'STIX Two Text', 'Cambria Math', 'Times New Roman', serif" font-size="17.92" font-weight="500" fill="#FBF6EC" text-anchor="middle">1</text>
<text x="112.0" y="213.6" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="21" font-weight="600" fill="#6E5D4E" text-anchor="start">Pull request to main</text>
<text x="70.0" y="243.4" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18" font-weight="400" fill="#4B3E35" text-anchor="start">a feature push alone does not trigger this CI workflow</text>
<rect x="52.0" y="298.1" width="467.7" height="178.5" rx="12" fill="#EDE7DC" stroke="#6E5D4E" stroke-width="1.8"/>
<circle cx="85.0" cy="324.9" r="16" fill="#7B2C34"/>
