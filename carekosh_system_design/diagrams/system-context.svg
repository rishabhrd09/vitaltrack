<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1401" width="1000" height="1401" role="img" aria-labelledby="system-context-title system-context-desc">
<title id="system-context-title">CareKosh at a glance</title>
<desc id="system-context-desc">The Android app talks to one FastAPI service over HTTPS with a bearer token. The service runs in a Docker container on Render and owns one PostgreSQL database, documented as hosted on Neon (CI and local use PostgreSQL 16). Default speech recognition and spoken replies run on the phone; the speech pack is downloaded once from Moonshine. Groq, Brevo and Sentry are used only when configured. There is no queue, no Redis, no worker service, no offline write queue and no over-the-air app update.</desc>
