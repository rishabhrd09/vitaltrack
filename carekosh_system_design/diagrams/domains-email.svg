<text x="112.0" y="699.3" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="21" font-weight="600" fill="#2E5677" text-anchor="start">FastAPI service</text>
<text x="70.0" y="729.1" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18" font-weight="400" fill="#4B3E35" text-anchor="start">Gunicorn + 2 Uvicorn workers serving /api/v1</text>
<path d="M263.5,627.9 L263.5,657.9" fill="none" stroke="#4B3E35" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#domains-email-ah-flow)"/>
