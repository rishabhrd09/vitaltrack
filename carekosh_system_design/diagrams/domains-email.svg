<text x="58.0" y="861.3" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#7B2C34" text-anchor="start" letter-spacing="1.6">GOOD TO KNOW</text>
<text x="58.0" y="891.3" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18" font-weight="400" fill="#4B3E35" text-anchor="start">render.yaml sets FRONTEND_URL to https://api.carekosh.com/api/v1/auth for production (the live value is not</text>
<text x="58.0" y="916.9" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18" font-weight="400" fill="#4B3E35" text-anchor="start">verified). Moving to another host means repointing DNS; installed apps keep working because the hostname stays the</text>
<text x="58.0" y="942.4" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18" font-weight="400" fill="#4B3E35" text-anchor="start">same.</text>
