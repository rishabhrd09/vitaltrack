<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 993" width="1000" height="993" role="img" aria-labelledby="domains-email-title domains-email-desc">
<title id="domains-email-title">Domains, TLS and email links</title>
<desc id="domains-email-desc">As documented (live DNS, proxy and certificate settings are not verified here): Cloudflare serves DNS for carekosh.com; api.carekosh.com and staging-api.carekosh.com point to Render, which terminates TLS and forwards to the FastAPI service. Emails go out through the Brevo HTTP API; their links use FRONTEND_URL, so the verification, password-reset and account-deletion pages open on the API host itself.</desc>
<style data-fonts="standalone">@import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&amp;family=STIX+Two+Text:ital,wght@0,400..700;1,400..700&amp;display=swap");</style>
<defs><pattern id="domains-email-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.15" fill="#CDBB9C" opacity="0.6"/></pattern><marker id="domains-email-ah-flow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 L2.4,5 Z" fill="#4B3E35"/></marker><marker id="domains-email-ah-optional" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 L2.4,5 Z" fill="#6B3A6E"/></marker><marker id="domains-email-ah-reply" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 L2.4,5 Z" fill="#7C6B5C"/></marker></defs>
<rect width="100%" height="100%" fill="#FBF6EC"/>
<rect width="100%" height="100%" fill="url(#domains-email-dots)"/>
<text x="40.0" y="58.0" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="30" font-weight="500" fill="#1A1512" text-anchor="start">Domains, TLS and email links</text>
<text x="40.0" y="98.3" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18.5" font-weight="400" fill="#7C6B5C" text-anchor="start" font-style="italic">The app only knows a hostname. DNS decides which server answers, and the API also serves the pages behind email links.</text>
<rect x="40.0" y="122.3" width="447.0" height="683.0" rx="14" fill="#F4F0E3" stroke="#CDD2B5" stroke-width="1.2"/>
