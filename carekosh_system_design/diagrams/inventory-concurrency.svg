<text x="58.0" y="890.0" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#B2423B" text-anchor="start" letter-spacing="1.6">IN THE APP TODAY</text>
<text x="58.0" y="920.0" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18" font-weight="400" fill="#4B3E35" text-anchor="start">The app now captures the version with the form fields (A-1 fixed locally). A cache refresh cannot replace that version.</text>
<text x="58.0" y="945.6" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18" font-weight="400" fill="#4B3E35" text-anchor="start">After 409, active queries refetch; reopen the form for current values. Retry retains the original variables and version.</text>
</svg>
