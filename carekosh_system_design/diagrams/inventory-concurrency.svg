<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 997" width="1000" height="997" role="img" aria-labelledby="inventory-concurrency-title inventory-concurrency-desc">
<title id="inventory-concurrency-title">Two phones edit the same item</title>
<desc id="inventory-concurrency-desc">Phone A and phone B both read the item at version 3. A saves first: the UPDATE matches version 3 and the row becomes version 4. Edit Item sends the item name, so B&#x27;s PUT first waits on the account&#x27;s name lock until A commits; its SELECT then sees A&#x27;s committed row, its UPDATE matches no row and the API returns 409 with those current values. The losing UPDATE overwrites nothing. A request without a name, such as the API-only stock PATCH, instead waits on A&#x27;s row lock and re-checks its WHERE clause.</desc>
<style data-fonts="standalone">@import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&amp;family=STIX+Two+Text:ital,wght@0,400..700;1,400..700&amp;display=swap");</style>
<defs><pattern id="inventory-concurrency-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.15" fill="#CDBB9C" opacity="0.6"/></pattern><marker id="inventory-concurrency-ah-fail" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 L2.4,5 Z" fill="#B2423B"/></marker><marker id="inventory-concurrency-ah-flow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 L2.4,5 Z" fill="#4B3E35"/></marker><marker id="inventory-concurrency-ah-reply" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 L2.4,5 Z" fill="#7C6B5C"/></marker></defs>
<rect width="100%" height="100%" fill="#FBF6EC"/>
<rect width="100%" height="100%" fill="url(#inventory-concurrency-dots)"/>
<text x="40.0" y="58.0" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="30" font-weight="500" fill="#1A1512" text-anchor="start">Two phones edit the same item</text>
<text x="40.0" y="98.3" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18.5" font-weight="400" fill="#7C6B5C" text-anchor="start" font-style="italic">Optimistic concurrency: each save names the version it read, so only the first save with version 3 can win.</text>
