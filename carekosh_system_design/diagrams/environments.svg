<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1051" width="1000" height="1051" role="img" aria-labelledby="environments-title environments-desc">
<title id="environments-title">Three environments</title>
<desc id="environments-desc">Development uses Expo Go (a development build would first need expo-dev-client), a local API on port 8000 and a local PostgreSQL with development data. Staging uses the preview APK, staging-api.carekosh.com, the staging Render service and the documented vitaltrack_staging database. Production uses the production AAB through Google Play, api.carekosh.com, the production Render service and the documented neondb database. The API address is fixed in each app build; the database and secrets are set on each backend service.</desc>
<style data-fonts="standalone">@import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&amp;family=STIX+Two+Text:ital,wght@0,400..700;1,400..700&amp;display=swap");</style>
<defs><pattern id="environments-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.15" fill="#CDBB9C" opacity="0.6"/></pattern><marker id="environments-ah-flow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.6" markerHeight="4.6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 L2.4,5 Z" fill="#4B3E35"/></marker></defs>
<rect width="100%" height="100%" fill="#FBF6EC"/>
<rect width="100%" height="100%" fill="url(#environments-dots)"/>
<text x="40.0" y="58.0" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="30" font-weight="500" fill="#1A1512" text-anchor="start">Three environments, one codebase</text>
<text x="40.0" y="98.3" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="18.5" font-weight="400" fill="#7C6B5C" text-anchor="start" font-style="italic">Same code everywhere. The app build decides which API it calls; each backend service decides which database and secrets it uses.</text>
