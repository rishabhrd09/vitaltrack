name: Release CareKosh web
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-carekosh-web-production
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/carekosh-web.yml
    with:
      retain_production_build: true

  publish:
    name: Publish production frontend
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: carekosh-web-production
      url: https://homeicuinventory.carekosh.com
    defaults:
      run:
        working-directory: carekosh-web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: carekosh-web/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: carekosh-web-production
          path: carekosh-web/dist-production
      - name: Publish verified assets and configure the custom domain
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the CLOUDFLARE_ACCOUNT_ID environment variable in GitHub}"
          : "${CLOUDFLARE_API_TOKEN:?Set the CLOUDFLARE_API_TOKEN environment secret in GitHub}"
          npx --no-install wrangler deploy --env production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
      - name: Verify the public frontend serves the released build
        env:
          SITE: https://homeicuinventory.carekosh.com
        run: |
          entry=$(grep -Eo '/assets/[^"]+\.js"' dist-production/index.html | head -1 | tr -d '"')
          test -n "$entry"
          for attempt in {1..20}; do
            if curl -fsS --max-time 10 "$SITE/" -o "$RUNNER_TEMP/live-index.html" &&
               grep -Fq "$entry" "$RUNNER_TEMP/live-index.html" &&
               curl -fsS --compressed --max-time 10 "$SITE$entry" -o "$RUNNER_TEMP/live-entry.js" &&
               cmp -s "dist-production$entry" "$RUNNER_TEMP/live-entry.js"; then
              echo "Verified $SITE/ serves the released JavaScript bundle."
              exit 0
            fi
            sleep 15
          done
          echo "::error::Wrangler published the Worker, but the public hostname did not serve the expected build during verification."
          exit 1
